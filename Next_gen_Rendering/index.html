<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBR Shader WebGL Showcase - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: sans-serif;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="info">Use Mouse to orbit | Use GUI to adjust PBR & Lights</div>

    <!-- Core Three.js & Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- dat.GUI for Interactive Controls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>

    <script>
        // 1. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // 2. Scene & Camera Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x1a1a24, 0.03);

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 3, 7);

        // 3. Mouse Interaction (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.01; // ห้ามทะลุใต้พื้น

        // 4. Lights Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        // Main Interactive Point Light
        const mainLight = new THREE.PointLight(0xffaa00, 2, 20);
        mainLight.position.set(2, 3, 2);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        // Helper Sphere to show light position
        const lightHelperGeo = new THREE.SphereGeometry(0.1, 16, 16);
        const lightHelperMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const lightHelper = new THREE.Mesh(lightHelperGeo, lightHelperMat);
        mainLight.add(lightHelper);

        // Directional Light for Environment Fill
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(-5, 8, -5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 5. Environment Map (PBR Skybox Reflection)
        const exrSkyboxUrl = 'https://dl.polyhaven.org/file/ph-assets/HDRIs/exr/1k/venice_sunset_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = envMap;
                scene.environment = envMap;
                texture.dispose();
                pmremGenerator.dispose();
            });

        // 6. PBR Floor & Environment Structures
        const textureLoader = new THREE.TextureLoader();
        const floorTex = textureLoader.load('https://sibsansuk.github.io/mossy_cobblestone_diff_1k.jpg');
        floorTex.wrapS = THREE.RepeatWrapping;
        floorTex.wrapT = THREE.RepeatWrapping;
        floorTex.repeat.set(4, 4);

        const floorMat = new THREE.MeshStandardMaterial({
            map: floorTex,
            roughness: 0.8,
            metalness: 0.1
        });

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(15, 15), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Environment Structure (PBR Decorative Pillars)
        const pillarGeo = new THREE.BoxGeometry(0.8, 3, 0.8);
        const pillarMat = new THREE.MeshStandardMaterial({
            color: 0x444455,
            roughness: 0.2,
            metalness: 0.8
        });

        const pillar1 = new THREE.Mesh(pillarGeo, pillarMat);
        pillar1.position.set(-3, 1.5, -2);
        pillar1.castShadow = true;
        pillar1.receiveShadow = true;
        scene.add(pillar1);

        const pillar2 = pillar1.clone();
        pillar2.position.set(3, 1.5, -2);
        scene.add(pillar2);

        // 7. Main Character with PBR Material Parameters
        const characterPBRMat = new THREE.MeshStandardMaterial({
            color: 0x00aaff,
            metalness: 0.8,
            roughness: 0.2
        });

        let mainCharacter = null;
        const gltfLoader = new THREE.GLTFLoader();
        
        gltfLoader.load('https://kanatippoom.github.io/comgraph/3dmodel/Model2.glb', (gltf) => {
            mainCharacter = gltf.scene;
            mainCharacter.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    // ปรับใช้ PBR Material Control
                    child.material = characterPBRMat;
                }
            });
            mainCharacter.position.set(0, 0, 0);
            scene.add(mainCharacter);
        });

        // 8. GUI Interactive Controls
        const gui = new dat.GUI({ width: 300 });

        // Light Controls
        const lightFolder = gui.addFolder('Interactive Light Position');
        lightFolder.add(mainLight.position, 'x', -5, 5).name('Light X');
        lightFolder.add(mainLight.position, 'y', 0.5, 6).name('Light Y');
        lightFolder.add(mainLight.position, 'z', -5, 5).name('Light Z');
        lightFolder.add(mainLight, 'intensity', 0, 5).name('Light Intensity');
        lightFolder.open();

        // PBR Material Controls (Main Character)
        const pbrFolder = gui.addFolder('Character PBR Material');
        const pbrParams = {
            baseColor: '#00aaff'
        };

        pbrFolder.addColor(pbrParams, 'baseColor').name('Base Color').onChange((value) => {
            characterPBRMat.color.set(value);
        });
        pbrFolder.add(characterPBRMat, 'metalness', 0.0, 1.0, 0.01).name('Metallic');
        pbrFolder.add(characterPBRMat, 'roughness', 0.0, 1.0, 0.01).name('Roughness');
        pbrFolder.open();

        // 9. Animation Loop
        function animate(time) {
            requestAnimationFrame(animate);

            if (mainCharacter) {
                mainCharacter.rotation.y = Math.sin(time * 0.0005) * 0.5;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate(0);

        // 10. Responsive Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
