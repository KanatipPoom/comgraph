function putPixel(x,y,r,g,b,a=255){
const index=(y*canvas.width+x)*4;
data[index]=r;
data[index+1]=g;
data[index+2]=b;
data[index+3]=a;
}
function drawLine(x1,y1,x2,y2,r,g,b,a=255){
const dx=Math.abs(x2-x1);
const dy=Math.abs(y2-y1);
if(dx>dy){
    const m=(y2-y1)/(x2-x1);
    const c=y1-m*x1;
    for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) {
      const y = Math.round(m * x + c);
      putPixel(x, y, r, g, b, a);
    }
  } else {
    const m = (x2 - x1) / (y2 - y1);
    const c = x1 - m * y1;
    for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) {
      const x = Math.round(m * y + c);
      putPixel(x, y, r, g, b, a);
    }
  }

}
function drawEllipse(cx, cy, rx, ry, r, g, b, a = 255) {
    for (let y = -ry; y <= ry; y++) {
        for (let x = -rx; x <= rx; x++) {
            if ((rx > 0 && ry > 0) && ((x * x) / (rx * rx) + (y * y) / (ry * ry) < 1)) {
                putPixel(cx + x, cy + y, r, g, b, a);
            } else if (rx === 0 && ry === 0) {
                putPixel(cx, cy, r, g, b, a);
            }
        }
    }
}
function drawRectFilled(x1,y1,x2,y2,r,g,b,a = 255){
    for(let y = y1; y <= y2; y++){
        for(let x = x1; x <= x2; x++){
                putPixel(x,y,r,g,b,a);
        }
    }
}

function drawSpriteRotate(sprite, x, y, degree, scale_x, scale_y) {
  for (let j = 0; j < sprite.length; j++) {
    for (let i = 0; i < sprite[j].length; i++) {
      const color = sprite[j][i];
      if (color !== null && color !== 0) {
        const rComp = (color === 1) ? r : (color >> 16) & 255;
        const gComp = (color === 1) ? g : (color >> 8) & 255;
        const bComp = (color === 1) ? b : color & 255;

        const cx = i - sprite[j].length / 2;
        const cy = j - sprite.length / 2;
        const rad = degree * (Math.PI / 180);
        const x_rot = Math.round(cx * Math.cos(rad) - cy * Math.sin(rad));
        const y_rot = Math.round(cx * Math.sin(rad) + cy * Math.cos(rad));
        
        const xscale = Math.round(x_rot * scale_x);
        const yscale = Math.round(y_rot * scale_y);
        drawEllipse(xscale + x, yscale + y, Math.round(scale_x), Math.round(scale_y), rComp, gComp, bComp, 255);
      }
    }
  }
}
canvas.addEventListener('click', function(event) {
    const { x, y } = toScaledMouseCoords(event.clientX, event.clientY);
    putPixel(x, y, 255, 0, 0); 
    ctx.putImageData(imageData, 0, 0);
});
    
function toScaledMouseCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: Math.floor((clientX - rect.left) * scaleX),
        y: Math.floor((clientY - rect.top) * scaleY)
    };
}
        
canvas.addEventListener('mousedown',function(event){
    const{x,y}=toScaledMouseCoords(event.clientX,event.clientY);
    putPixel(x,y,r,g,b);
    ctx.putImageData(imageData,0,0);
    dargging=false;
});
canvas.addEventListener('mouseup',function(event){
    const{x,y}=toScaledMouseCoords(event.clientX,event.clientY);
    putPixel(x,y,r,g,b);
    ctx.putImageData(imageData,0,0);
    dargging=true;
});
canvas.addEventListener('mousemove',function(event){
    const{x,y}=toScaledMouseCoords(event.clientX,event.clientY);
    if(dargging==false){
        drawLine(previousMouseX,previousMouseY,x,y,r,g,b,255);   
        putPixel(x,y,r,g,b);
        
        // บันทึกพิกัดสีเส้นลงประวัติ เพื่อไม่ให้แอนิเมชันลบ
        drawingHistory.push({x1: previousMouseX, y1: previousMouseY, x2: x, y2: y, r: r, g: g, b: b});
        
        ctx.putImageData(imageData,0,0);
    }
    previousMouseX =x;
    previousMouseY =y;
});

window.addEventListener('keydown',function(event){
    if(event.key=='1'){
        r=255;g=0;b=0;
    }else if(event.key=='2'){
        r=0;g=255;b=0;
    }else if(event.key=='3'){
        r=0;g=0;b=255;
    }else if(event.key=='e'){
        r=255;g=255;b=255;
    }

    if(event.key== 'ArrowLeft'){
        degree-=5;
    }else if(event.key=='ArrowRight'){
        degree+=5;
    }else if(event.key=='ArrowDown'){
        scale=Math.max(0.1, scale-0.1); // ป้องกันไม่ให้ย่อจนสเกลติดลบ
    }else if(event.key=='ArrowUp'){
        scale+=0.1;
    }
});

function animate() {
  drawRectFilled(0,0,canvas.width,canvas.height,255,255,255);
  for(let i=0; i<drawingHistory.length; i++){
   let d = drawingHistory[i];
  drawLine(d.x1, d.y1, d.x2, d.y2, d.r, d.g, d.b, 255);
}
        

          

drawSpriteRotate(smileSprite24Bit,250,200,degree,scale,scale);
ctx.putImageData(imageData, 0, 0);
requestAnimationFrame(animate);
}
