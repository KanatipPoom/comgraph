<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBR Showcase - Camera Navigation Controls</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 10;
        }
        /* UI สำหรับปุ่มกดเลื่อนมุมกล้อง < > */
        #camera-nav {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            z-index: 100;
            user-select: none;
        }
        .nav-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }
        #view-label {
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            min-width: 140px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="info">Use Mouse to orbit / zoom freely | Use Arrows to switch Focus Points</div>

    <!-- ปุ่มควบคุมมุมกล้องหน้าจอ -->
    <div id="camera-nav">
        <button class="nav-btn" id="prev-btn">&lt;</button>
        <span id="view-label">มุมมอง 1</span>
        <button class="nav-btn" id="next-btn">&gt;</button>
    </div>

    <!-- Core Three.js & Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>

    <script>
        // Variables สำหรับ Animation & Camera Transition
        let mixer = null;
        const animationsMap = new Map();
        const animActionsState = {}; 
        const clock = new THREE.Clock();

        // ตัวแปรระบบเปลี่ยนมุมกล้อง
        let isTransitioning = false;
        let targetCameraPos = new THREE.Vector3();
        let targetControlsTarget = new THREE.Vector3();
        const meshMap = new Map();

        // รายการมุมกล้องสำหรับกดลูกศรเลื่อน
        let cameraTargets = [];
        let currentTargetIndex = 0;

        // 1. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // 2. Scene & Camera Setup
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);

        // 3. Mouse Interaction (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 4. Lights Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const mainLight = new THREE.PointLight(0xffaa00, 2, 20);
        mainLight.position.set(2, 3, 2);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        scene.add(mainLight);

        const lightHelperGeo = new THREE.SphereGeometry(0.1, 16, 16);
        const lightHelperMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const lightHelper = new THREE.Mesh(lightHelperGeo, lightHelperMat);
        mainLight.add(lightHelper);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(-5, 8, -5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 5. Environment Map (PBR Skybox Background)
        const exrSkyboxUrl = 'https://kanatippoom.github.io/comgraph/3dmodel/qwantani_moon_noon_puresky_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = envMap;
                scene.environment = envMap;
                texture.dispose();
                pmremGenerator.dispose();
            });

        // 6. GUI Setup
        const gui = new dat.GUI({ width: 320 });

        const lightFolder = gui.addFolder('Interactive Light Position');
        lightFolder.add(mainLight.position, 'x', -5, 5).name('Light X');
        lightFolder.add(mainLight.position, 'y', 0.5, 6).name('Light Y');
        lightFolder.add(mainLight.position, 'z', -5, 5).name('Light Z');
        lightFolder.add(mainLight, 'intensity', 0, 5).name('Point Light Intensity');
        lightFolder.add(ambientLight, 'intensity', 0, 2).name('Ambient Light');
        lightFolder.open();

        const animFolder = gui.addFolder('Multi-Animation Controls');

        // ฟังก์ชันคำนวณการซูมมุ่งหน้าไปยัง Target Object
        function focusOnTarget(targetObj) {
            if (!targetObj) return;

            document.getElementById('view-label').innerText = targetObj.label;

            if (targetObj.isDefault) {
                // สำหรับ "มุมมอง 1" (ให้ผู้ใช้งานหมุน/ย่อ/ขยาย/ซูมอิสระ ไม่บังคับซูมกล้อง)
                isTransitioning = false;
            } else {
                // สำหรับมุมมองซูมเข้าหาวัตถุเฉพาะ
                const box = new THREE.Box3().setFromObject(targetObj.mesh);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                const maxDim = Math.max(size.x, size.y, size.z);
                const fov = camera.fov * (Math.PI / 180);
                let cameraDistance = Math.abs(maxDim / (2 * Math.tan(fov / 2))) * 2.5;
                
                if (cameraDistance < 0.8) cameraDistance = 0.8;

                targetControlsTarget.copy(center);
                const offset = camera.position.clone().sub(controls.target).normalize().multiplyScalar(cameraDistance);
                targetCameraPos.copy(center).add(offset);

                isTransitioning = true;
            }
        }

        // 7. Main Character & Objects Setup
        let mainCharacter = null;
        const gltfLoader = new THREE.GLTFLoader();
        
        gltfLoader.load('https://media.githubusercontent.com/media/KanatipPoom/comgraph/main/3dmodel/Finalwork3.glb', (gltf) => {
            mainCharacter = gltf.scene;

            // จัดกึ่งกลางโมเดล
            const box = new THREE.Box3().setFromObject(mainCharacter);
            const center = box.getCenter(new THREE.Vector3());
            mainCharacter.position.x -= center.x;
            mainCharacter.position.y -= box.min.y;
            mainCharacter.position.z -= center.z;

            // ตรวจหา Object ชิ้นส่วนภายในเพื่อจับคู่กับเป้าหมาย
            let text001Mesh = null;
            let textMesh = null;
            let screenshotMesh = null;

            mainCharacter.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    
                    const name = child.name || '';
                    meshMap.set(name, child);

                    if (name.includes('Text001') || name === 'Text001') text001Mesh = child;
                    else if (name.includes('Text') || name === 'Text') {
                        if (!textMesh && !name.includes('Text001')) textMesh = child;
                    }
                    else if (name.toLowerCase().includes('screen') || name.includes('สกรีน') || child.material?.map) {
                        if (!screenshotMesh && child !== text001Mesh && child !== textMesh) {
                            screenshotMesh = child;
                        }
                    }
                }
            });

            // สร้างรายการมุมกล้องเรียงลำดับเป็น มุมมอง 1, มุมมอง 2, มุมมอง 3, ...
            const rawTargets = [
                { isDefault: true },
                { mesh: text001Mesh || meshMap.get('Text001') },
                { mesh: textMesh || meshMap.get('Text') },
                { mesh: screenshotMesh }
            ].filter(target => target.isDefault || target.mesh);

            // ใส่ชื่อ label: มุมมอง 1, มุมมอง 2, ...
            cameraTargets = rawTargets.map((item, index) => ({
                ...item,
                label: `มุมมอง ${index + 1}`
            }));

            scene.add(mainCharacter);

            // --- Multi-Animations Setup ---
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(mainCharacter);

                gltf.animations.forEach((clip) => {
                    const action = mixer.clipAction(clip);
                    animationsMap.set(clip.name, action);
                    animActionsState[clip.name] = false;

                    animFolder.add(animActionsState, clip.name).name(clip.name).onChange((isEnabled) => {
                        const targetAction = animationsMap.get(clip.name);
                        if (isEnabled) targetAction.reset().play();
                        else targetAction.stop();
                    });
                });

                const firstClipName = gltf.animations[0].name;
                animActionsState[firstClipName] = true;
                animationsMap.get(firstClipName).play();

                animFolder.open();
            }
        });

        // Event Listener สำหรับปุ่มลูกศร < และ >
        document.getElementById('prev-btn').addEventListener('click', () => {
            if (cameraTargets.length === 0) return;
            currentTargetIndex = (currentTargetIndex - 1 + cameraTargets.length) % cameraTargets.length;
            focusOnTarget(cameraTargets[currentTargetIndex]);
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            if (cameraTargets.length === 0) return;
            currentTargetIndex = (currentTargetIndex + 1) % cameraTargets.length;
            focusOnTarget(cameraTargets[currentTargetIndex]);
        });

        // 8. Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (mixer) {
                mixer.update(delta);
            }

            // เลื่อนกล้องเข้าหาตำแหน่งที่เลือกเฉพาะตอนกดเปลี่ยนไปยังมุมมองที่มีการโฟกัสวัตถุ
            if (isTransitioning) {
                camera.position.lerp(targetCameraPos, 0.08);
                controls.target.lerp(targetControlsTarget, 0.08);

                if (camera.position.distanceTo(targetCameraPos) < 0.01 && 
                    controls.target.distanceTo(targetControlsTarget) < 0.01) {
                    isTransitioning = false;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 9. Responsive Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
