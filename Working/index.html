<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBR Showcase - Original Model Color with Custom Lighting</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
    </style>
</head>

<body>

    <!-- Core Three.js & Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/EXRLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // ==========================================
        // Custom Shader Source Code (โมเดลหลัก)
        // ==========================================
        const vertexShader = `
            uniform float uTime;
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosW;

            void main() {
                vUv = uv;
                vNormal = normalize(mat3(modelMatrix) * normal);
                vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                vPosW = worldPosition.xyz;

                vec3 pos = position;

                gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
            }
        `;

        const fragmentShader = `
            precision mediump float;
            uniform sampler2D uTexture;
            uniform vec3 uBaseColor;
            uniform bool uHasTexture;
            uniform vec3 uLightDir;
            uniform float uTime;

            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosW;

            void main() {
                vec3 N = normalize(vNormal);
                vec3 L = normalize(uLightDir);
                
                float diffuse = max(dot(N, L), 0.0);
                float ambient = 0.3;

                float level = 4.0;
                diffuse = floor(diffuse * level) / level;

                // Phong specular
                vec3 R = reflect(-L, N);
                vec3 V = normalize(cameraPosition - vPosW);
                float specular = pow(max(dot(R, V), 0.0), 4.0);

                specular = step(0.5, specular);

                // ดึงสีดั้งเดิมจาก Texture หรือ Material Color ของโมเดล
                vec3 baseColor = uBaseColor;
                if (uHasTexture) {
                    baseColor *= texture2D(uTexture, vUv).rgb;
                }

                // รวมสีโมเดลเดิมเข้ากับแสงเงา (Diffuse, Ambient, Specular)
                vec3 color = baseColor * (diffuse + ambient) + vec3(specular * 0.4);

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // ==========================================
        // Three.js Main Setup
        // ==========================================
        let mixer = null;
        const clock = new THREE.Clock();

        // 1. Renderer Setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        // 2. Scene & Camera Setup
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 2, 5);

        // 3. Mouse Interaction (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 4. Lights Setup
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const mainLight = new THREE.PointLight(0xffaa00, 2, 20);
        mainLight.position.set(2, 3, 2);
        mainLight.castShadow = true;
        scene.add(mainLight);

        // 5. Environment Map (แก้ URL ให้รองรับ Git LFS ผ่าน media.githubusercontent)
        const exrSkyboxUrl = 'https://media.githubusercontent.com/media/KanatipPoom/comgraph/main/3dmodel/qwantani_moon_noon_puresky_1k.exr';
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        pmremGenerator.compileEquirectangularShader();

        new THREE.EXRLoader()
            .setDataType(THREE.UnsignedByteType)
            .load(exrSkyboxUrl, (texture) => {
                const envMap = pmremGenerator.fromEquirectangular(texture).texture;
                scene.background = envMap;
                scene.environment = envMap;
                texture.dispose();
                pmremGenerator.dispose();
            }, undefined, (err) => {
                console.error('Error loading EXR Skybox:', err);
            });

        // 6. Load Main Character Model
        let mainCharacter = null;
        const gltfLoader = new THREE.GLTFLoader();
        
        gltfLoader.load('https://media.githubusercontent.com/media/KanatipPoom/comgraph/main/3dmodel/Finalwork3.glb', (gltf) => {
            mainCharacter = gltf.scene;

            const box = new THREE.Box3().setFromObject(mainCharacter);
            const center = box.getCenter(new THREE.Vector3());
            mainCharacter.position.x -= center.x;
            mainCharacter.position.y -= box.min.y;
            mainCharacter.position.z -= center.z;

            mainCharacter.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    
                    const origMat = child.material;
                    const origTexture = (origMat && origMat.map) ? origMat.map : null;
                    const origColor = (origMat && origMat.color) ? origMat.color : new THREE.Color(1, 1, 1);

                    child.material = new THREE.ShaderMaterial({
                        vertexShader: vertexShader,
                        fragmentShader: fragmentShader,
                        uniforms: {
                            uTime: { value: 0.0 },
                            uLightDir: { value: mainLight.position.clone().normalize() },
                            uTexture: { value: origTexture },
                            uBaseColor: { value: new THREE.Vector3(origColor.r, origColor.g, origColor.b) },
                            uHasTexture: { value: origTexture !== null }
                        },
                        side: THREE.DoubleSide
                    });
                }
            });

            scene.add(mainCharacter);

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(mainCharacter);
                const action = mixer.clipAction(gltf.animations[0]);
                action.play();
            }
        });

        // 7. Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            const delta = clock.getDelta();

            if (mainCharacter) {
                mainCharacter.traverse((child) => {
                    if (child.isMesh && child.material.uniforms && child.material.uniforms.uTime) {
                        child.material.uniforms.uTime.value = elapsedTime;
                    }
                });
            }

            if (mixer) {
                mixer.update(delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 8. Responsive Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
